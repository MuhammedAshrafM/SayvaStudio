name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Dependency Graph, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matches ADR-002's enforcement stack, weakest-signal first:
      # style, then static checks that don't need a build, then checks
      # that do, then the build itself.
      - name: Format check
        run: pnpm run format:check

      - name: Lint (ESLint boundaries, DR-07)
        run: pnpm run lint

      - name: Dependency graph check (dependency-cruiser, DR-08)
        run: pnpm run depcruise

      - name: Type check
        run: pnpm run check-types

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
